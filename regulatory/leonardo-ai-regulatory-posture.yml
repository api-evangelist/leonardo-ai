  ai_transparency:
    url: https://leonardo.ai/terms-of-service
    section: '7. Disclaimer regarding Generative AI and Large Language Models'
    evidence:
    - source: https://leonardo.ai/terms-of-service
      http_status: 200
      fetched: '2026-10-21'
      quote: "7.1 Our Platform utilises generative AI and large language model technologies, which can produce content that may appear highly realistic or convincing, including text, images, audio, and video outputs (collectively, Generated Content). You acknowledge and agree that Generated Content may include deep fakes, misinformation, biases, or other potentially misleading or inaccurate information."
    - source: https://leonardo.ai/privacy-policy
      http_status: 200
      fetched: '2026-10-21'
      quote: "If you don’t want your Content to be used for machine learning, you can generate Content privately with any paid subscription plan. Private Content isn’t accessible to others and won’t be used by Leonardo.Ai for model training."
    note: >-
      A contractual disclosure that outputs are AI-generated and may be misleading, plus a stated
      training-use policy: user Content may train models unless generated privately on a paid plan
      (ToS 8.5 repeats that Private Content is not used for training without express written consent).
      No model cards, content-labelling or watermarking commitment was found on these pages.
  training_data_summary:
    url: https://leonardo.ai/privacy-policy
    section: '1. Personal information we collect — (I) Information we collect from other sources'
