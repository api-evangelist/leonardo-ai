notes:
- 'Production API key, created on the web app API Access page ("Create New Key"); sent as `authorization: Bearer <YOUR_API_KEY>`. "Keep your API key secure. Do not embed it in client-side code." (getting-started)'
- API keys are UUIDs; malformed keys yield "Invalid response from authorization hook" (https://docs.leonardo.ai/docs/api-error-messages).
- The User API key is deprecated and replaced by the Production API key; limit of 10 API keys per account (https://docs.leonardo.ai/docs/api-faq).
- 'Webhook callbacks authenticate to the receiver with `authorization: Bearer <webhook callback API key>` (https://docs.leonardo.ai/docs/guide-to-the-webhook-callback-feature).'
- API plans are distinct from web app plans. No OAuth is documented.
