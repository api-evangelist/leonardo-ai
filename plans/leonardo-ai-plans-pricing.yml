note: The API is Pay-As-You-Go, billed from a prepaid USD balance by the models and features used. The docs publish no per-unit prices; per-request cost is estimated in the in-app Pricing Calculator (https://app.leonardo.ai/api-access/pricing-calculator, sign-in required) and exposed by the Pricing Calculator API operation. Legacy API subscription plans still exist for customers who have not migrated. https://leonardo.ai/pricing/ answered 403 to a scripted GET on 2026-10-21 and was not read.
plans:
- name: Pay-As-You-Go (PAYG)
  description: Prepaid, non-expiring account balance topped up manually (whole amounts) or by automatic top-ups at a threshold; usage costs are deducted in real time; API requests pause when the balance reaches zero.
  price_text: The API is priced on a Pay-As-You-Go basis, with no upfront commitment or monthly fees.
  features:
  - Manual and automatic top-ups
  - Account balance does not expire
  - Generation responses include a `cost` object (amount charged and unit)
  limits:
  - API requests pause when the balance reaches zero
- name: Custom / enterprise
  description: For high-volume usage, dedicated infrastructure or custom per-model discounts; arranged through the Custom Deals contact form on the API Access tab or Customer Support.
  price_text: please contact our team via the Custom Deals contact us form on the [API Access](https://app.leonardo.ai/api-access) Tab, or via general Customer Support, to discuss a tailored plan.
  price: Contact sales
  features:
  - Custom pricing and per-model discounts
  - Dedicated infrastructure
  - Customised concurrency, queue and rate limits (per https://docs.leonardo.ai/docs/guide-to-concurrency-queue-and-rate-limit)
  limits: []
