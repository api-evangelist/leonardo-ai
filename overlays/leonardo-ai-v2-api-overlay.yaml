    x-error-guide: https://docs.leonardo.ai/docs/api-error-messages
    x-rate-limit-guide: https://docs.leonardo.ai/docs/guide-to-concurrency-queue-and-rate-limit
- target: $.paths['/generations'].post
  description: Link createGeneration to its provider reference page.
  update:
    externalDocs:
      url: https://docs.leonardo.ai/reference/creategeneration.md
- target: $.paths['/generationssync'].post
  description: Link createSyncGeneration to its provider reference page.
  update:
    externalDocs:
      url: https://docs.leonardo.ai/reference/createsyncgeneration.md
- target: $.paths['/models'].get
  description: Link getModels to its provider reference page.
  update:
    externalDocs:
      url: https://docs.leonardo.ai/reference/getmodels.md
- target: $.paths['/generations'].post
  description: Record async completion (webhook callback or polling) and the MCP tool that fronts this operation.
  update:
